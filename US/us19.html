<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US-19: Encuesta de Preferencias Metodológicas</title>
  <link rel="stylesheet" href="../CSS/styleus19.css">
</head>
<body>

  <header class="main-header">
    <h1>SISTEMAS DE GESTIÓN DE CALIDAD</h1>
    <p>Encuesta de Preferencias</p>
  </header>

  <main class="wizard-card">

    <div class="progress-container">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-steps">
        <div class="step-node" data-step="1">
          <div class="node-circle"></div>
          <span class="node-label">requisitos</span>
        </div>
        <div class="step-node" data-step="2">
          <div class="node-circle"></div>
          <span class="node-label">ritmo</span>
        </div>
        <div class="step-node" data-step="3">
          <div class="node-circle"></div>
          <span class="node-label">gestión</span>
        </div>
        <div class="step-node" data-step="4">
          <div class="node-circle"></div>
          <span class="node-label">organización</span>
        </div>
        <div class="step-node" data-step="5">
          <div class="node-circle"></div>
          <span class="node-label">capacidad</span>
        </div>
        <div class="step-node" data-step="6">
          <div class="node-circle"></div>
          <span class="node-label">entregas</span>
        </div>
      </div>
    </div>

    <section class="wizard-body" id="wizardBody">
      <!-- Generado dinámicamente con JavaScript -->
    </section>

    <footer class="wizard-footer">
      <button id="btnAnterior" class="btn btn-secondary">Anterior</button>
      <button id="btnSiguiente" class="btn btn-primary">Siguiente</button>
    </footer>

  </main>

  <script src="../JS/us19.js"></script>
</body>
</html>
