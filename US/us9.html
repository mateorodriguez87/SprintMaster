
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodologías Ágiles | Gestión de Calidad</title>
    <link rel="stylesheet" href="../CSS/styleus9.css">
</head>
<body>

    <!-- Fondo decorativo -->
    <div class="us9-puntos us9-puntos-izquierda"></div>
    <div class="us9-puntos us9-puntos-derecha"></div>

    <!-- Encabezado -->
    <header class="us9-encabezado">
        <div class="us9-decoracion us9-decoracion-izquierda">
            <span>+</span>
            <span>+</span>
        </div>

        <div class="us9-titulo-principal">
            <h1>SISTEMAS DE GESTIÓN DE CALIDAD</h1>
            <a href="../index.html">Inicio</a>
        </div>

        <div class="us9-decoracion us9-decoracion-derecha">
            <span>+</span>
            <span>+</span>
        </div>

        <!-- Botón del menú -->
        <button class="us9-menu-boton" id="us9MenuBoton"
                aria-label="Abrir menú"
                aria-expanded="false"
                aria-controls="us9Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="us9-menu" id="us9Menu" hidden>
            <a href="../index.html">Inicio</a>
            <a href="#" data-metodologia="scrum">Ciclo Sprint</a>
            <a href="#" data-metodologia="kanban">Flujo Kanban</a>
            <a href="#" data-metodologia="xp">Programación XP</a>
        </nav>
    </header>

    <!-- Contenido -->
    <main class="us9-contenedor">

        <div class="us9-selector" aria-label="Seleccionar metodología">
            <button class="us9-selector-boton activo"
                    data-metodologia="scrum"
                    type="button">
                Ciclo Sprint
            </button>

            <button class="us9-selector-boton"
                    data-metodologia="kanban"
                    type="button">
                Flujo Kanban
            </button>

            <button class="us9-selector-boton"
                    data-metodologia="xp"
                    type="button">
                Programación XP
            </button>
        </div>

        <!-- Ventana principal -->
        <section class="us9-panel" id="us9Panel">

            <!-- Zona reservada para la imagen -->
            <div class="us9-imagen-contenedor">
                <button class="us9-cerrar" id="us9Cerrar"
                        type="button" aria-label="Cerrar detalle">
                    &times;
                </button>

                <!--
                    ESPACIO PARA TU IMAGEN:
                    Reemplazá el contenido de este div por tu imagen.

                    Ejemplo:
                    <img src="../IMG/ciclo-sprint.png"
                         alt="Diagrama del ciclo Sprint"
                         class="us9-imagen">
                -->

                <div class="us9-imagen-placeholder" id="us9ImagenPlaceholder">
                    <div class="us9-placeholder-icono">＋</div>
                    <h2>Espacio para la imagen</h2>
                    <p id="us9ImagenAyuda">
                        Colocá aquí el diagrama del ciclo Sprint.
                    </p>
                    <span>Reemplazá este bloque por tu etiqueta &lt;img&gt;</span>
                </div>
            </div>

            <!-- Texto descriptivo -->
            <div class="us9-descripcion">
                <h2 id="us9Titulo">Ciclo Sprint</h2>
                <div id="us9Texto">
                    <!-- El contenido se genera con JavaScript -->
                </div>
            </div>

        </section>

        <p class="us9-ayuda">
            Seleccioná una metodología para consultar su explicación.
        </p>

    </main>
 <script src="../JS/us9.js" ></script>
</body>
</html>
